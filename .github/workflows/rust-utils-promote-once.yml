name: Rust utilities promote once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-utils-promote-once.yml'

concurrency:
  group: rust-utils-promote-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove TypeScript compatibility and security tests are green
        run: |
          pnpm exec vitest run \
            packages/utils/src/check-data-dir.test.ts \
            packages/utils/src/check-data-dir-security.test.ts

      - name: Prove Rust formatting, compatibility, and security tests are green
        run: |
          cargo fmt --manifest-path crates/workflow-utils/Cargo.toml -- --check
          cargo fmt --manifest-path rust/tdd/workflow-utils/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets
          cargo test --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test check_data_dir
          cargo clippy --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test check_data_dir -- -D warnings

      - name: Fast-forward to the latest migration head
        run: |
          git fetch origin pro/rust-repository-port
          git reset --hard origin/pro/rust-repository-port

      - name: Promote the verified tests and record WF-RUST-100
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target = 'packages/utils/src/check-data-dir.test.ts'
          security_target = 'packages/utils/src/check-data-dir-security.test.ts'

          red_path = Path('rust/tdd-red.json')
          red = json.loads(red_path.read_text())
          before = len(red['cases'])
          red['cases'] = [case for case in red['cases'] if case.get('typescript') != target]
          if len(red['cases']) != before - 1:
              raise SystemExit('expected exactly one check-data-dir RED case')
          red_path.write_text(json.dumps(red, indent=2) + '\n')

          overrides_path = Path('rust/test-port-overrides.json')
          overrides = json.loads(overrides_path.read_text())
          matches = [entry for entry in overrides['entries'] if entry.get('typescript') == target]
          if len(matches) != 1:
              raise SystemExit('expected exactly one check-data-dir override')
          matches[0].update({
              'status': 'green',
              'rustTests': [
                  'rust/tdd/workflow-utils/tests/check_data_dir.rs',
                  'crates/workflow-utils/tests/check_data_dir_security.rs',
              ],
              'notes': (
                  'All 23 TypeScript compatibility assertions execute against the production '
                  'workflow-utils crate through the translated Rust suite. Five additional Rust '
                  'security tests reject regular files, path-component suffix lookalikes, and '
                  'user-qualified tilde confusion. The focused TypeScript compatibility and '
                  'security suites must remain green in .github/workflows/rust-utils.yml.'
              ),
          })
          overrides_path.write_text(json.dumps(overrides, indent=2) + '\n')

          fragment_path = Path('rust/test-port-overrides.d/utils-check-data-dir-security.json')
          fragment_path.write_text(json.dumps({
              'schemaVersion': 1,
              'entries': [{
                  'typescript': security_target,
                  'status': 'green',
                  'rustTests': [
                      'crates/workflow-utils/tests/check_data_dir_security.rs',
                  ],
                  'notes': (
                      'Four TypeScript regressions prove accessible files and raw suffix '
                      'lookalikes are rejected. The production Rust suite adds the same object-type '
                      'and component-boundary checks plus literal user-qualified tilde handling.'
                  ),
              }],
          }, indent=2) + '\n')

          security_path = Path('security.txt')
          security = security_path.read_text()
          if '# WF-RUST-100:' not in security:
              security += (
                  '\n#\n'
                  '# WF-RUST-100: Workflow-data discovery previously treated any accessible\n'
                  '# filesystem object as a directory and used raw string suffix checks. A regular\n'
                  '# file at .workflow-data, or a directory such as not.workflow-data, could be\n'
                  '# selected as a trusted local storage root. TypeScript now requires an actual\n'
                  '# directory and exact path components. Rust mirrors that contract with\n'
                  '# metadata().is_dir(), Path::ends_with(), lexical normalization, and injected\n'
                  '# cwd/home context. Both TypeScript suites, the 23-case translated Rust suite,\n'
                  '# and five Rust security regressions are required to stay green. Full analysis\n'
                  '# is in docs/rust-port/findings/WF-RUST-100.md.\n'
              )
              security_path.write_text(security)

          rules_path = Path('docs/rust-port/SECURITY.md')
          rules = rules_path.read_text()
          section = '''\n## Filesystem discovery boundaries\n\nA path is not a trusted directory merely because it is accessible or its text\nends with a familiar suffix. Discovery code must validate the filesystem object\ntype and compare complete path components. Security regressions must cover\nregular files, suffix lookalikes, normalization, and platform-root termination.\nWF-RUST-100 applies this rule to workflow-data discovery in TypeScript and Rust.\n'''
          if '## Filesystem discovery boundaries' not in rules:
              rules_path.write_text(rules.rstrip() + '\n' + section)

          ledger_path = Path('docs/rust-port/TYPESCRIPT_LOGIC_AND_SECURITY_FIXES.md')
          ledger = ledger_path.read_text()
          entry = '''\n## WF-RUST-100: Workflow data path type and suffix confusion\n\nTypeScript previously used `fs.access()` and raw `endsWith()` checks while\ndiscovering local workflow data. The security regression was committed first;\nTypeScript and Rust now require a directory at exact path-component boundaries.\nThe full evidence, impact, tests, and retirement condition are recorded in\n`docs/rust-port/findings/WF-RUST-100.md`.\n'''
          if '## WF-RUST-100:' not in ledger:
              ledger_path.write_text(ledger.rstrip() + '\n' + entry)
          PY

          node scripts/rust-port-test-inventory.mjs \
            --write-json /tmp/rust-port-test-inventory.json
          node scripts/bootstrap-rust-test-port-manifest.mjs \
            /tmp/rust-port-test-inventory.json \
            rust/test-port-manifest.json
          node scripts/rust-port-test-inventory.mjs \
            --check rust/test-port-manifest.json

      - name: Commit verified GREEN promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/tdd-red.json \
            rust/test-port-overrides.json \
            rust/test-port-overrides.d/utils-check-data-dir-security.json \
            rust/test-port-manifest.json \
            security.txt \
            docs/rust-port/SECURITY.md \
            docs/rust-port/TYPESCRIPT_LOGIC_AND_SECURITY_FIXES.md
          git commit --signoff -m 'test(rust-utils): promote data-dir parity to GREEN'
          git push origin HEAD:pro/rust-repository-port
