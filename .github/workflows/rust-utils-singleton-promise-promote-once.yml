name: Rust utilities singleton and promise promote once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-utils-singleton-promise-promote-once.yml'

concurrency:
  group: rust-utils-singleton-promise-promote-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove TypeScript compatibility oracles
        run: |
          pnpm exec biome ci \
            packages/utils/src/global-singleton.ts \
            packages/utils/src/global-singleton.test.ts \
            packages/utils/src/promise.ts \
            packages/utils/src/promise.test.ts
          pnpm exec vitest run \
            packages/utils/src/global-singleton.test.ts \
            packages/utils/src/promise.test.ts

      - name: Prove both translated suites were RED before implementation
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/utils-singleton-promise-red \
            8d2b2775c7f9b84df507d5ca87dd304889329a1d

          set +e
          singleton_output="$(cargo test --locked \
            --manifest-path /tmp/utils-singleton-promise-red/rust/tdd/workflow-utils/Cargo.toml \
            --test global_singleton 2>&1)"
          singleton_status=$?
          promise_output="$(cargo test --locked \
            --manifest-path /tmp/utils-singleton-promise-red/rust/tdd/workflow-utils/Cargo.toml \
            --test promise 2>&1)"
          promise_status=$?
          set -e

          printf '%s\n' "$singleton_output"
          printf '%s\n' "$promise_output"
          git worktree remove --force /tmp/utils-singleton-promise-red

          if [ "$singleton_status" -eq 0 ] || [ "$promise_status" -eq 0 ]; then
            echo 'an expected historical RED suite unexpectedly passed' >&2
            exit 1
          fi
          grep -F \
            'TDD RED: packages/utils/src/global-singleton.test.ts implementation pending' \
            <<<"$singleton_output"
          grep -F \
            'TDD RED: packages/utils/src/promise.test.ts implementation pending' \
            <<<"$promise_output"

      - name: Prove production and translated Rust suites are GREEN
        run: |
          cargo fmt --manifest-path crates/workflow-utils/Cargo.toml -- --check
          cargo fmt --manifest-path rust/tdd/workflow-utils/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets
          cargo test --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test global_singleton
          cargo test --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test promise
          cargo clippy --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test global_singleton -- -D warnings
          cargo clippy --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test promise -- -D warnings

      - name: Refuse to promote a different branch head
        run: |
          git fetch origin pro/rust-repository-port
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/pro/rust-repository-port)"

      - name: Promote verified mappings
        run: |
          python scripts/promote-rust-utils-singleton-promise-green.py
          node scripts/rust-port-test-inventory.mjs \
            --write-json /tmp/rust-port-test-inventory.json
          node scripts/bootstrap-rust-test-port-manifest.mjs \
            /tmp/rust-port-test-inventory.json \
            rust/test-port-manifest.json
          node scripts/rust-port-test-inventory.mjs \
            --check rust/test-port-manifest.json

      - name: Commit verified GREEN promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            rust/tdd-red.json \
            rust/test-port-overrides.json \
            rust/test-port-manifest.json \
            docs/rust-port/PARITY_MATRIX.md
          git commit --signoff -m 'test(rust-utils): promote singleton and promise to GREEN'
          git push origin HEAD:pro/rust-repository-port
