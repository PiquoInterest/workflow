name: Rust utilities debug-log RED promote once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-utils-debug-log-red-promote-once.yml'

concurrency:
  group: rust-utils-debug-log-red-promote-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-register-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove the TypeScript security characterization
        run: |
          pnpm exec biome ci \
            packages/utils/src/debug-log.ts \
            packages/utils/src/debug-log.test.ts \
            packages/utils/src/debug-log-security.test.ts
          pnpm exec vitest run \
            packages/utils/src/debug-log.test.ts \
            packages/utils/src/debug-log-security.test.ts

      - name: Prove the translated Rust target compiles cleanly
        run: |
          cargo fmt --manifest-path rust/tdd/workflow-utils/Cargo.toml -- --check
          cargo test --locked \
            --manifest-path rust/tdd/workflow-utils/Cargo.toml \
            --test debug_log_security \
            --no-run
          cargo clippy --locked \
            --manifest-path rust/tdd/workflow-utils/Cargo.toml \
            --test debug_log_security \
            -- -D warnings

      - name: Observe the registered Rust security failure
        run: |
          set +e
          output="$(cargo test --locked \
            --manifest-path rust/tdd/workflow-utils/Cargo.toml \
            --test debug_log_security 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo 'The debug selector security target unexpectedly passed before implementation.' >&2
            exit 1
          fi
          grep -F \
            'TDD RED: packages/utils/src/debug-log.test.ts implementation pending' \
            <<<"$output"

      - name: Generate the reviewed test-port manifest and TDD-RED security record
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('security.txt')
          text = path.read_text()
          marker = '# WF-RUST-102:'
          if marker not in text:
              text += (
                  '\n#\n'
                  '# WF-RUST-102: TDD RED. The TypeScript debug gate enables workflow\n'
                  '# diagnostics whenever the complete DEBUG string merely contains\n'
                  '# "workflow:", including unrelated and explicitly negated selector\n'
                  '# tokens. The TypeScript characterization proves diagnostic arguments\n'
                  '# are forwarded under that condition. The translated Rust tests require\n'
                  '# token-aware matching and a silent sink, but production Rust is not yet\n'
                  '# implemented, so this entry is not a mitigation claim. Full analysis is\n'
                  '# in docs/rust-port/findings/WF-RUST-102.md.\n'
              )
              path.write_text(text)
          PY

          node scripts/rust-port-test-inventory.mjs \
            --write-json /tmp/rust-port-test-inventory.json
          node scripts/bootstrap-rust-test-port-manifest.mjs \
            /tmp/rust-port-test-inventory.json \
            rust/test-port-manifest.json
          node scripts/rust-port-test-inventory.mjs \
            --check rust/test-port-manifest.json

      - name: Refuse to register against a different branch head
        run: |
          git fetch origin pro/rust-repository-port
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/pro/rust-repository-port)"

      - name: Commit the observed RED state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/test-port-manifest.json security.txt
          git commit --signoff -m 'test(rust-utils): register debug selector security RED'
          git push origin HEAD:pro/rust-repository-port
