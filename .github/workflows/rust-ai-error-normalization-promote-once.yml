name: Rust AI error normalization promote once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-ai-error-normalization-promote-once.yml'

permissions:
  contents: write

jobs:
  promote:
    name: Persist verified AI error-normalization promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the triggering branch state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust 1.87 formatter
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: rustfmt

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Promote reviewed sources and close WF-RUST-103
        shell: python
        run: |
          import json
          from pathlib import Path

          compatibility = "packages/ai/src/get-error-message.test.ts"
          security = "packages/ai/src/get-error-message-security.test.ts"
          evidence = (
              " GREEN verified by the permanent read-only AI lane in workflow run "
              "33584024158 at 31426849bbd4e67771a7bc3fa6c2e915ae963f06. "
              "That run passed the TypeScript oracles, production and translated Rust "
              "tests, Rustfmt, and Clippy with warnings denied."
          )

          primary_path = Path("rust/test-port-overrides.json")
          primary = json.loads(primary_path.read_text(encoding="utf-8"))
          matches = [
              entry for entry in primary["entries"]
              if entry["typescript"] == compatibility
          ]
          if len(matches) != 1 or matches[0]["status"] != "red":
              raise SystemExit("compatibility override is not exactly one RED entry")
          matches[0]["status"] = "green"
          if not matches[0]["notes"].endswith("."):
              matches[0]["notes"] += "."
          matches[0]["notes"] += evidence
          primary_path.write_text(
              json.dumps(primary, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          security_override_path = Path(
              "rust/test-port-overrides.d/ai-get-error-message-security.json"
          )
          security_overrides = json.loads(
              security_override_path.read_text(encoding="utf-8")
          )
          matches = [
              entry for entry in security_overrides["entries"]
              if entry["typescript"] == security
          ]
          if len(matches) != 1 or matches[0]["status"] != "red":
              raise SystemExit("security override is not exactly one RED entry")
          matches[0]["status"] = "green"
          if not matches[0]["notes"].endswith("."):
              matches[0]["notes"] += "."
          matches[0]["notes"] += evidence
          security_override_path.write_text(
              json.dumps(security_overrides, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          red_path = Path("rust/tdd-red.json")
          red = json.loads(red_path.read_text(encoding="utf-8"))
          selected = [
              case for case in red["cases"]
              if case["typescript"] == compatibility
          ]
          if len(selected) != 1:
              raise SystemExit("compatibility expected-RED case is missing or duplicated")
          red["cases"] = [
              case for case in red["cases"]
              if case["typescript"] != compatibility
          ]
          red_path.write_text(
              json.dumps(red, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          security_red_path = Path(
              "rust/tdd-red.d/ai-get-error-message-security.json"
          )
          security_red = json.loads(
              security_red_path.read_text(encoding="utf-8")
          )
          if [case["typescript"] for case in security_red["cases"]] != [security]:
              raise SystemExit("security expected-RED fragment does not match")
          security_red_path.unlink()

          shim_path = Path("rust/tdd/workflow-ai/src/lib.rs")
          shim = shim_path.read_text(encoding="utf-8")
          imports = (
              "use std::marker::PhantomData;\n"
              "use std::sync::atomic::{AtomicUsize, Ordering};\n"
              "use std::sync::{Arc, Weak};\n"
          )
          if imports not in shim:
              raise SystemExit("AI RED-shim imports changed unexpectedly")
          shim = shim.replace(imports, "use std::marker::PhantomData;\n", 1)
          start_marker = "#[derive(Debug, Clone)]\npub struct CallableProbe"
          end_marker = "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum IteratorCase"
          start = shim.find(start_marker)
          end = shim.find(end_marker)
          if start < 0 or end <= start:
              raise SystemExit("AI RED-shim hostile-value block changed unexpectedly")
          shim = (
              shim[:start]
              + "pub use workflow_ai::{\n"
              + "    CallableProbe, ErrorValue, SharedErrorObject, get_error_message,\n"
              + "};\n\n"
              + shim[end:]
          )
          shim_path.write_text(shim, encoding="utf-8")

          security_path = Path("security.txt")
          security_text = security_path.read_text(encoding="utf-8")
          if "WF-RUST-103" in security_text:
              raise SystemExit("WF-RUST-103 is already present in security.txt")
          security_text = security_text.rstrip() + "\n\n#\n" + """# WF-RUST-103: TypeScript AI error normalization delegates arbitrary
# non-nullish values to JSON.stringify. That executes an object-controlled
# toJSON hook and throws for cyclic objects and BigInts while another failure is
# already being handled. The TypeScript characterization keeps all three legacy
# behaviors reproducible. Rust preserves ordinary JSON compatibility but treats
# callable fields as inert data, tracks shared-object identity, bounds recursive
# traversal, canonicalizes BigInts, and returns fixed placeholders for cycles,
# released references, excessive depth, and invalid BigInt text. Expected-RED
# run 33583543050 and permanent GREEN run 33584024158 cover the TypeScript
# oracles, translated Rust suites, direct production regressions, Rustfmt, and
# Clippy. Full analysis is in docs/rust-port/findings/WF-RUST-103.md.
"""
          security_path.write_text(security_text, encoding="utf-8")

          ledger_path = Path("docs/rust-port/TYPESCRIPT_LOGIC_AND_SECURITY_FIXES.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          if "## WF-RUST-103:" in ledger:
              raise SystemExit("WF-RUST-103 is already present in the findings ledger")
          ledger = ledger.rstrip() + "\n\n" + """## WF-RUST-103: Error normalization executed hooks and could mask failures

**Status:** Closed at the production Rust AI boundary; TypeScript remains the
legacy compatibility and security oracle.

**Affected code:** `packages/ai/src/get-error-message.ts` and the Rust
`workflow-ai` error-normalization contract.

**Old behavior:** Every non-nullish, non-string, non-Error value was passed to
`JSON.stringify`. An object-supplied `toJSON` callback executed during failure
handling, while cyclic values and BigInts threw a second `TypeError`.

**Impact:** Diagnostic normalization could perform re-entrant side effects,
replace the original diagnostic, or mask it with a secondary availability
failure. This does not claim code injection: the callback is already executable
inside the process, but normalization invoked it implicitly.

**Fix:** Rust uses an inert typed value model, cycle detection, a depth bound,
canonical BigInt diagnostics, and fixed non-reflective placeholders. Ordinary
objects, arrays, primitives, escaping, and nested `undefined` retain the
TypeScript compatibility contract.

**Regression evidence:**

- `packages/ai/src/get-error-message.test.ts`
- `packages/ai/src/get-error-message-security.test.ts`
- `rust/tdd/workflow-ai/tests/get_error_message.rs`
- `rust/tdd/workflow-ai/tests/get_error_message_security.rs`
- `crates/workflow-ai/tests/get_error_message_security.rs`
- expected-RED workflow run `33583543050`
- permanent GREEN workflow run `33584024158`
- `docs/rust-port/findings/WF-RUST-103.md`
"""
          ledger_path.write_text(ledger, encoding="utf-8")

      - name: Format the promoted Rust shim
        run: cargo fmt --manifest-path rust/tdd/workflow-ai/Cargo.toml

      - name: Regenerate and verify the canonical manifest
        run: |
          node scripts/rust-port-test-inventory.mjs \
            --write-json /tmp/rust-port-test-inventory.json
          node scripts/bootstrap-rust-test-port-manifest.mjs \
            /tmp/rust-port-test-inventory.json \
            rust/test-port-manifest.json
          node scripts/rust-port-test-inventory.mjs \
            --check rust/test-port-manifest.json
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(
            fs.readFileSync('rust/test-port-manifest.json', 'utf8')
          );
          const expected = {
            unported: 223,
            partial: 0,
            red: 80,
            green: 39,
            blocked: 0,
          };
          if (JSON.stringify(manifest.statusCounts) !== JSON.stringify(expected)) {
            throw new Error(
              `unexpected promoted counts: ${JSON.stringify(manifest.statusCounts)}`
            );
          }
          NODE

      - name: Re-run the promoted Rust tests
        run: |
          cargo test --locked --manifest-path crates/workflow-ai/Cargo.toml --all-targets
          cargo test --locked --manifest-path rust/tdd/workflow-ai/Cargo.toml --test get_error_message
          cargo test --locked --manifest-path rust/tdd/workflow-ai/Cargo.toml --test get_error_message_security

      - name: Commit only after a branch-head guard
        run: |
          git diff --check
          git fetch origin pro/rust-repository-port
          test "$(git rev-parse origin/pro/rust-repository-port)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            rust/test-port-overrides.json \
            rust/test-port-overrides.d/ai-get-error-message-security.json \
            rust/test-port-manifest.json \
            rust/tdd-red.json \
            rust/tdd-red.d/ai-get-error-message-security.json \
            rust/tdd/workflow-ai/src/lib.rs \
            security.txt \
            docs/rust-port/TYPESCRIPT_LOGIC_AND_SECURITY_FIXES.md
          git diff --cached --quiet && { echo 'promotion produced no changes' >&2; exit 1; }
          git commit -m 'test(rust-ai): promote error normalization to GREEN'
          git push origin HEAD:pro/rust-repository-port
