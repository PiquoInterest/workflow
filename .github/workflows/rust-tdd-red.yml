name: Rust TDD expected RED

on:
  push:
    branches:
      - pro/rust-repository-port
  pull_request:
    paths:
      - 'rust/tdd/**'
      - 'rust/tdd-red.json'
      - 'rust/tdd-red.d/**'
      - 'rust/test-port-manifest.json'
      - 'rust/test-port-overrides.json'
      - 'rust/test-port-overrides.d/**'
      - 'scripts/run-rust-tdd-red.mjs'
      - 'scripts/bootstrap-rust-test-port-manifest.mjs'
      - 'scripts/rust-port-test-inventory.mjs'
      - '.github/workflows/rust-tdd-red.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  expected-red:
    name: Compile cleanly, then fail only at registered TDD markers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Check formatting, compilation, and Clippy before expected failures
        shell: bash
        run: |
          set -euo pipefail
          for manifest in rust/tdd/*/Cargo.toml; do
            echo "::group::$manifest"
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --locked --manifest-path "$manifest" --tests --no-run
            cargo clippy --locked --manifest-path "$manifest" --tests -- -D warnings
            echo '::endgroup::'
          done

      - name: Confirm every translated suite fails at its source-specific marker
        run: node scripts/run-rust-tdd-red.mjs

      - name: Verify the checked-in manifest includes reviewed fragments
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rust-port-test-inventory.mjs \
            --write-json /tmp/rust-port-test-inventory.json
          cp rust/test-port-manifest.json /tmp/rust-test-port-manifest.json
          node scripts/bootstrap-rust-test-port-manifest.mjs \
            /tmp/rust-port-test-inventory.json \
            /tmp/rust-test-port-manifest.json
          diff -u rust/test-port-manifest.json /tmp/rust-test-port-manifest.json
