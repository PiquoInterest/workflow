name: Rust port

on:
  push:
    branches:
      - pro/rust-repository-port
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/workflow-world/**'
      - 'rust/conformance/**'
      - 'packages/errors/src/**'
      - 'packages/serde/src/**'
      - 'packages/utils/src/time*'
      - 'packages/world/src/**'
      - 'docs/rust-port/**'
      - 'security.txt'
      - '.github/workflows/rust-port.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustfmt-snapshot:
    name: Canonical Rust 1.87 formatting snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: rustfmt

      - name: Format migration crate
        run: cargo fmt --package workflow-world

      - name: Upload formatted crate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-world-rustfmt-${{ github.sha }}
          path: crates/workflow-world
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact TypeScript oracle sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-port-typescript-oracles-${{ github.sha }}
          path: |
            packages/errors/src/index.ts
            packages/errors/src/index-implementation.ts
            packages/serde/src/index.ts
            packages/utils/src/time.ts
            packages/utils/src/time-implementation.ts
            packages/world/src/hooks.ts
            packages/world/src/steps.ts
            packages/world/src/steps-security.test.ts
          if-no-files-found: error
          retention-days: 1

  world-contract:
    name: World, steps, hooks, errors, serde, and time parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check canonical Rust formatting
        run: cargo fmt --package workflow-world -- --check

      - name: Compile and test Rust contracts
        run: cargo test --locked -p workflow-world --all-targets

      - name: Lint Rust contracts
        run: cargo clippy --locked -p workflow-world --all-targets -- -D warnings

      - name: Run TypeScript World and utility oracle tests
        run: |
          pnpm --filter @workflow/world test
          pnpm --filter @workflow/utils test

      - name: Build TypeScript oracle dependency boundary
        run: pnpm --filter @workflow/utils build

      - name: Run TypeScript error oracle tests
        run: pnpm --filter @workflow/errors test

      - name: Build differential conformance runners
        run: cargo build --locked -p workflow-world --examples

      - name: Compare TypeScript and Rust behavior
        run: |
          WORKFLOW_RUST_CONFORMANCE_BIN=target/debug/examples/conformance \
            pnpm exec vitest run rust/conformance/world-parity.test.ts
          WORKFLOW_RUST_STEP_CONFORMANCE_BIN=target/debug/examples/steps_conformance \
            pnpm exec vitest run rust/conformance/step-state-security.test.ts
          WORKFLOW_RUST_CONFORMANCE_BIN=target/debug/examples/hooks_conformance \
            pnpm exec vitest run rust/conformance/hooks-parity.test.ts
          WORKFLOW_RUST_CONFORMANCE_BIN=target/debug/examples/errors_conformance \
            pnpm exec vitest run rust/conformance/errors-parity.test.ts
