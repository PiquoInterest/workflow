name: Rust utilities debug-log promote once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-utils-debug-log-promote-once.yml'

concurrency:
  group: rust-utils-debug-log-promote-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove the TypeScript compatibility and unsafe characterization
        run: |
          pnpm exec biome ci \
            packages/utils/src/debug-log.ts \
            packages/utils/src/debug-log.test.ts \
            packages/utils/src/debug-log-security.test.ts
          pnpm exec vitest run \
            packages/utils/src/debug-log.test.ts \
            packages/utils/src/debug-log-security.test.ts

      - name: Prove pre-implementation Rust was RED
        run: |
          git worktree add --detach /tmp/workflow-utils-debug-log-red \
            6bb44ae74d12af43023f422aa33f359a7c85339f
          set +e
          output="$(cargo test --locked \
            --manifest-path /tmp/workflow-utils-debug-log-red/rust/tdd/workflow-utils/Cargo.toml \
            --test debug_log_security 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          git worktree remove --force /tmp/workflow-utils-debug-log-red
          if [ "$status" -eq 0 ]; then
            echo 'The translated security target unexpectedly passed before production Rust existed.' >&2
            exit 1
          fi
          grep -F \
            'TDD RED: packages/utils/src/debug-log.test.ts implementation pending' \
            <<<"$output"

      - name: Prove production and translated Rust suites are GREEN
        run: |
          cargo fmt --manifest-path crates/workflow-utils/Cargo.toml -- --check
          cargo fmt --manifest-path rust/tdd/workflow-utils/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets
          cargo test --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test debug_log
          cargo test --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test debug_log_security
          cargo clippy --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test debug_log -- -D warnings
          cargo clippy --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test debug_log_security -- -D warnings

      - name: Refuse to promote a different branch head
        run: |
          git fetch origin pro/rust-repository-port
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/pro/rust-repository-port)"

      - name: Promote verified test mappings and security records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base_target = 'packages/utils/src/debug-log.test.ts'
          security_target = 'packages/utils/src/debug-log-security.test.ts'

          red_path = Path('rust/tdd-red.json')
          red = json.loads(red_path.read_text())
          matches = [case for case in red['cases'] if case.get('typescript') == base_target]
          if len(matches) != 1:
              raise SystemExit(f'expected one RED registration for {base_target}, got {len(matches)}')
          red['cases'] = [case for case in red['cases'] if case.get('typescript') != base_target]
          red_path.write_text(json.dumps(red, indent=2) + '\n')

          security_red_path = Path('rust/tdd-red.d/utils-debug-log-security.json')
          if not security_red_path.exists():
              raise SystemExit(f'missing expected security RED fragment: {security_red_path}')
          security_red_path.unlink()

          overrides_path = Path('rust/test-port-overrides.json')
          overrides = json.loads(overrides_path.read_text())
          base_entries = [
              entry for entry in overrides['entries']
              if entry.get('typescript') == base_target
          ]
          if len(base_entries) != 1:
              raise SystemExit(f'expected one override for {base_target}, got {len(base_entries)}')
          base_entries[0].update({
              'status': 'green',
              'rustTests': [
                  'rust/tdd/workflow-utils/tests/debug_log.rs',
                  'crates/workflow-utils/tests/debug_log_security.rs',
              ],
              'notes': 'All six TypeScript selector and sink assertions execute against production workflow-utils. Rust additionally rejects substring-confused and explicitly negated workflow selectors, never invokes the sink when disabled, and redacts Debug output for diagnostic payloads. TypeScript intentionally remains an oracle for the legacy unsafe behavior documented as WF-RUST-102.',
          })
          overrides_path.write_text(json.dumps(overrides, indent=2) + '\n')

          fragment_path = Path('rust/test-port-overrides.d/utils-debug-log-security.json')
          fragment_path.write_text(json.dumps({
              'schemaVersion': 1,
              'entries': [{
                  'typescript': security_target,
                  'status': 'green',
                  'rustTests': [
                      'rust/tdd/workflow-utils/tests/debug_log_security.rs',
                      'crates/workflow-utils/tests/debug_log_security.rs',
                  ],
                  'notes': 'The two TypeScript declarations intentionally characterize the legacy substring matcher accepting unrelated and explicitly negated selectors and forwarding diagnostic arguments. The Rust translation and direct production tests require token-aware rejection, zero sink calls, negative-selector precedence, and redacted Debug output. Verified by read-only Rust utility workflow run 33558964834.',
              }],
          }, indent=2) + '\n')

          security_path = Path('security.txt')
          security = security_path.read_text()
          marker = '\n#\n# WF-RUST-102:'
          index = security.find(marker)
          if index < 0:
              raise SystemExit('WF-RUST-102 security record not found')
          security = security[:index].rstrip() + '''

#
# WF-RUST-102: TypeScript workflow debug gating uses whole-string substring
# matching, so unrelated names such as myworkflow:* and explicitly negated
# selectors such as app:*,-workflow:* still forward diagnostic arguments. The
# TypeScript characterization keeps that privacy defect reproducible. Rust
# parses comma/whitespace-delimited selector tokens, gives -* and -workflow:*
# precedence, rejects larger substring lookalikes, returns before touching the
# sink, and redacts Debug output for diagnostic values. The expected-RED proof
# and permanent GREEN run 33558964834 cover six compatibility, two translated
# security, and three direct production security tests. Full analysis is in
# docs/rust-port/findings/WF-RUST-102.md.
'''
          security_path.write_text(security)

          rules_path = Path('docs/rust-port/SECURITY.md')
          rules = rules_path.read_text()
          heading = '## Debug selector gating and diagnostic redaction'
          if heading not in rules:
              rules_path.write_text(rules.rstrip() + '''

## Debug selector gating and diagnostic redaction

Debug namespace configuration is untrusted text. Match complete comma- or
whitespace-delimited tokens, apply explicit negative selectors before positive
selectors, and return before formatting or forwarding arguments when disabled.
Diagnostic wrapper types must not expose payload values through derived or
custom `Debug` output. WF-RUST-102 applies this rule to workflow utility logs.
''')

          ledger_path = Path('docs/rust-port/TYPESCRIPT_LOGIC_AND_SECURITY_FIXES.md')
          ledger = ledger_path.read_text()
          heading = '## WF-RUST-102: Debug selector substring confusion'
          if heading not in ledger:
              ledger_path.write_text(ledger.rstrip() + '''

## WF-RUST-102: Debug selector substring confusion

The TypeScript debug gate treats any `DEBUG` string containing `workflow:` as
an enable signal, including unrelated namespaces and explicit negative tokens.
The committed TypeScript characterization proves that diagnostic arguments are
forwarded under those conditions. Rust uses token-aware matching, negative
selector precedence, a zero-call disabled path, and payload-redacting `Debug`
implementations. The pre-implementation Rust target is observed RED and the
permanent utility lane is GREEN in run `33558964834`. Full evidence is in
`docs/rust-port/findings/WF-RUST-102.md`.
''')

          finding_path = Path('docs/rust-port/findings/WF-RUST-102.md')
          finding = finding_path.read_text()
          finding = finding.replace(
              '## Status\n\nImplementation complete; permanent GREEN validation pending.',
              '## Status\n\nClosed at the production Rust debug boundary.',
              1,
          )
          finding = finding.replace(
              'This document does not claim closure until the permanent read-only utility lane passes on that formatted implementation and a separate guarded promotion updates the security and parity ledgers.',
              'The permanent read-only utility lane passed on the formatted implementation in workflow run `33558964834`. A branch-head-guarded promotion then removed the expected-RED registrations and updated the security and parity ledgers.',
              1,
          )
          finding_path.write_text(finding)

          matrix_path = Path('docs/rust-port/PARITY_MATRIX.md')
          matrix = matrix_path.read_text()
          heading = '## Utility security promotions'
          if heading not in matrix:
              matrix_path.write_text(matrix.rstrip() + '''

## Utility security promotions

| Contract | Status | Evidence |
| --- | --- | --- |
| Debug selector gating and diagnostic redaction | PROVEN | TypeScript legacy characterization plus production and translated Rust tests; read-only workflow run `33558964834`; WF-RUST-102 |
''')
          PY

          node scripts/rust-port-test-inventory.mjs \
            --write-json /tmp/rust-port-test-inventory.json
          node scripts/bootstrap-rust-test-port-manifest.mjs \
            /tmp/rust-port-test-inventory.json \
            rust/test-port-manifest.json
          node scripts/rust-port-test-inventory.mjs \
            --check rust/test-port-manifest.json

      - name: Commit verified GREEN promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            rust/tdd-red.json \
            rust/tdd-red.d/utils-debug-log-security.json \
            rust/test-port-overrides.json \
            rust/test-port-overrides.d/utils-debug-log-security.json \
            rust/test-port-manifest.json \
            security.txt \
            docs/rust-port/SECURITY.md \
            docs/rust-port/TYPESCRIPT_LOGIC_AND_SECURITY_FIXES.md \
            docs/rust-port/findings/WF-RUST-102.md \
            docs/rust-port/PARITY_MATRIX.md
          git commit --signoff -m 'test(rust-utils): promote secure debug-log to GREEN'
          git push origin HEAD:pro/rust-repository-port
