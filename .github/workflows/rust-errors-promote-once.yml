name: Rust errors promote once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-errors-promote-once.yml'

permissions:
  contents: write

jobs:
  promote:
    name: Persist verified error-suite promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Promote reviewed override entries
        shell: python
        run: |
          import json
          from pathlib import Path

          verified = {
              "packages/errors/src/ansi.test.ts",
              "packages/errors/src/build-error.test.ts",
              "packages/errors/src/corrupted-event-log-error.test.ts",
              "packages/errors/src/fatal-error.test.ts",
              "packages/errors/src/replay-divergence-error.test.ts",
              "packages/errors/src/runtime-decryption-error.test.ts",
              "packages/errors/src/serialization-error.test.ts",
              "packages/errors/src/workflow-error.test.ts",
          }
          evidence = (
              " GREEN verified against the TypeScript compatibility oracle, production Rust "
              "crate, translated Rust suite, Rustfmt, and Clippy in GitHub Actions run "
              "33582056933 at 63c1eae22b98e4cd81f7f3a876b9462401425adb."
          )

          overrides_path = Path("rust/test-port-overrides.json")
          overrides = json.loads(overrides_path.read_text(encoding="utf-8"))
          selected = {
              entry["typescript"]: entry
              for entry in overrides["entries"]
              if entry["typescript"] in verified
          }
          if set(selected) != verified:
              raise SystemExit(
                  f"override selection mismatch: {sorted(verified - set(selected))}"
              )
          stale = {
              name: entry["status"]
              for name, entry in selected.items()
              if entry["status"] != "red"
          }
          if stale:
              raise SystemExit(f"expected RED overrides before promotion: {stale}")

          for entry in selected.values():
              entry["status"] = "green"
              if not entry["notes"].endswith("."):
                  entry["notes"] += "."
              entry["notes"] += evidence

          overrides_path.write_text(
              json.dumps(overrides, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          red = json.loads(Path("rust/tdd-red.json").read_text(encoding="utf-8"))
          stale_red = sorted(
              case["typescript"]
              for case in red["cases"]
              if case["typescript"] in verified
          )
          if stale_red:
              raise SystemExit(f"promoted cases remain expected RED: {stale_red}")

      - name: Regenerate canonical manifest
        run: |
          node scripts/rust-port-test-inventory.mjs \
            --write-json /tmp/rust-port-test-inventory.json
          node scripts/bootstrap-rust-test-port-manifest.mjs \
            /tmp/rust-port-test-inventory.json \
            rust/test-port-manifest.json
          node scripts/apply-rust-test-port-overrides.mjs \
            rust/test-port-manifest.json \
            rust/test-port-overrides.json
          node scripts/rust-port-test-inventory.mjs \
            --check rust/test-port-manifest.json
          node - <<'NODE'
          const manifest = JSON.parse(
            require('node:fs').readFileSync('rust/test-port-manifest.json', 'utf8')
          );
          const expected = {
            unported: 224,
            partial: 0,
            red: 81,
            green: 37,
            blocked: 0,
          };
          if (JSON.stringify(manifest.statusCounts) !== JSON.stringify(expected)) {
            throw new Error(
              `unexpected promoted counts: ${JSON.stringify(manifest.statusCounts)}`
            );
          }
          NODE

      - name: Commit persistent promotion
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/test-port-overrides.json rust/test-port-manifest.json
          git diff --cached --quiet && { echo 'promotion produced no changes' >&2; exit 1; }
          git commit -m 'test(rust-errors): persist eight GREEN suites'
          git push origin HEAD:pro/rust-repository-port
