name: Rust utilities parse and pluralize promote once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-utils-parse-pluralize-promote-once.yml'

concurrency:
  group: rust-utils-parse-pluralize-promote-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove the pre-fix TypeScript security test is RED
        run: |
          cp packages/utils/src/parse-name.ts /tmp/parse-name-fixed.ts
          git show 1c4de98bb2f11c38432e3cb3ac4d18726baa5e64:packages/utils/src/parse-name.ts \
            > packages/utils/src/parse-name.ts
          set +e
          pnpm exec vitest run packages/utils/src/parse-name-security.test.ts
          status=$?
          set -e
          mv /tmp/parse-name-fixed.ts packages/utils/src/parse-name.ts
          if [ "$status" -eq 0 ]; then
            echo 'The security regression unexpectedly passed against the vulnerable TypeScript source.' >&2
            exit 1
          fi

      - name: Prove the pre-implementation Rust pluralize suite is RED
        run: |
          git worktree add --detach /tmp/workflow-utils-pre-pluralize \
            b550ce9f0fdd7df5d75dd0892849ab429c8c1479^
          set +e
          cargo test --locked \
            --manifest-path /tmp/workflow-utils-pre-pluralize/rust/tdd/workflow-utils/Cargo.toml \
            --test pluralize
          status=$?
          set -e
          git worktree remove --force /tmp/workflow-utils-pre-pluralize
          if [ "$status" -eq 0 ]; then
            echo 'The translated pluralize suite unexpectedly passed before production Rust existed.' >&2
            exit 1
          fi

      - name: Prove focused TypeScript formatting and behavior are GREEN
        run: |
          pnpm exec biome ci \
            packages/utils/src/parse-name.ts \
            packages/utils/src/parse-name-security.test.ts
          pnpm exec vitest run \
            packages/utils/src/parse-name.test.ts \
            packages/utils/src/parse-name-security.test.ts \
            packages/utils/src/pluralize.test.ts

      - name: Prove production and translated Rust suites are GREEN
        run: |
          cargo fmt --manifest-path crates/workflow-utils/Cargo.toml -- --check
          cargo fmt --manifest-path rust/tdd/workflow-utils/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets
          cargo test --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test parse_name
          cargo test --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test pluralize
          cargo clippy --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test parse_name -- -D warnings
          cargo clippy --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test pluralize -- -D warnings

      - name: Refuse to promote a different branch head
        run: |
          git fetch origin pro/rust-repository-port
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/pro/rust-repository-port)"

      - name: Promote verified test mappings and security records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          parse_target = 'packages/utils/src/parse-name.test.ts'
          parse_security_target = 'packages/utils/src/parse-name-security.test.ts'
          pluralize_target = 'packages/utils/src/pluralize.test.ts'

          red_path = Path('rust/tdd-red.json')
          red = json.loads(red_path.read_text())
          targets = {parse_target, pluralize_target}
          counts = {target: 0 for target in targets}
          retained = []
          for case in red['cases']:
              target = case.get('typescript')
              if target in targets:
                  counts[target] += 1
              else:
                  retained.append(case)
          if any(count != 1 for count in counts.values()):
              raise SystemExit(f'expected one RED registration per target, got {counts}')
          red['cases'] = retained
          red_path.write_text(json.dumps(red, indent=2) + '\n')

          overrides_path = Path('rust/test-port-overrides.json')
          overrides = json.loads(overrides_path.read_text())

          def promote(target, rust_tests, notes):
              matches = [
                  entry for entry in overrides['entries']
                  if entry.get('typescript') == target
              ]
              if len(matches) != 1:
                  raise SystemExit(f'expected one override for {target}, got {len(matches)}')
              matches[0].update({
                  'status': 'green',
                  'rustTests': rust_tests,
                  'notes': notes,
              })

          promote(
              parse_target,
              [
                  'rust/tdd/workflow-utils/tests/parse_name.rs',
                  'crates/workflow-utils/tests/parse_name_security.rs',
              ],
              'All 35 translated parser, formatter, and display-name tests execute against the production workflow-utils crate. Three TypeScript and three Rust security regressions require control characters and Unicode line separators to be escaped from log-oriented output while preserving ordinary names.',
          )
          promote(
              pluralize_target,
              ['rust/tdd/workflow-utils/tests/pluralize.rs'],
              'All four translated test functions and eleven concrete assertions execute against the production workflow-utils pluralize implementation, preserving the exact TypeScript count === 1 contract.',
          )
          overrides_path.write_text(json.dumps(overrides, indent=2) + '\n')

          fragment_path = Path('rust/test-port-overrides.d/utils-parse-name-security.json')
          fragment_path.write_text(json.dumps({
              'schemaVersion': 1,
              'entries': [{
                  'typescript': parse_security_target,
                  'status': 'green',
                  'rustTests': [
                      'crates/workflow-utils/tests/parse_name_security.rs',
                  ],
                  'notes': 'The pre-fix TypeScript implementation is observed RED. Fixed TypeScript and Rust format parsed and fallback names as one logical line by escaping C0, DEL/C1, CR, LF, tab, U+2028, and U+2029 without reflecting controls into logs.',
              }],
          }, indent=2) + '\n')

          security_path = Path('security.txt')
          security = security_path.read_text()
          if '# WF-RUST-101:' not in security:
              security += (
                  '\n#\n'
                  '# WF-RUST-101: Machine-name formatters previously emitted parsed and legacy\n'
                  '# names verbatim into log-oriented strings. CR/LF, ANSI and other C0/C1\n'
                  '# controls, and Unicode line separators could forge log lines or alter terminal\n'
                  '# rendering. TypeScript and Rust now escape these characters while preserving\n'
                  '# ordinary output. The vulnerable TypeScript source is proved RED, and 35\n'
                  '# translated Rust compatibility tests plus dedicated TypeScript/Rust security\n'
                  '# regressions are required to stay green. Full analysis is in\n'
                  '# docs/rust-port/findings/WF-RUST-101.md.\n'
              )
              security_path.write_text(security)

          rules_path = Path('docs/rust-port/SECURITY.md')
          rules = rules_path.read_text()
          section = '''\n## Log-oriented identifier rendering\n\nIdentifiers read from workflow state, adapters, or legacy records remain\nuntrusted when rendered for logs. Single-line formatters must escape C0, C1,\nDEL, CR, LF, tab, U+2028, and U+2029 rather than allowing terminal controls or\nline injection. WF-RUST-101 applies this rule to machine workflow and step names.\n'''
          if '## Log-oriented identifier rendering' not in rules:
              rules_path.write_text(rules.rstrip() + '\n' + section)

          ledger_path = Path('docs/rust-port/TYPESCRIPT_LOGIC_AND_SECURITY_FIXES.md')
          ledger = ledger_path.read_text()
          entry = '''\n## WF-RUST-101: Machine-name control-character log injection\n\nThe pre-fix TypeScript formatter emitted parsed and legacy machine names\nverbatim into log-oriented strings. The committed regression is observed RED\nagainst that source. TypeScript and Rust now escape log-breaking controls while\npreserving ordinary parser and display-name behavior. Full evidence and closure\nrequirements are in `docs/rust-port/findings/WF-RUST-101.md`.\n'''
          if '## WF-RUST-101:' not in ledger:
              ledger_path.write_text(ledger.rstrip() + '\n' + entry)
          PY

          node scripts/rust-port-test-inventory.mjs \
            --write-json /tmp/rust-port-test-inventory.json
          node scripts/bootstrap-rust-test-port-manifest.mjs \
            /tmp/rust-port-test-inventory.json \
            rust/test-port-manifest.json
          node scripts/rust-port-test-inventory.mjs \
            --check rust/test-port-manifest.json

      - name: Commit verified GREEN promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rust/tdd-red.json \
            rust/test-port-overrides.json \
            rust/test-port-overrides.d/utils-parse-name-security.json \
            rust/test-port-manifest.json \
            security.txt \
            docs/rust-port/SECURITY.md \
            docs/rust-port/TYPESCRIPT_LOGIC_AND_SECURITY_FIXES.md
          git commit --signoff -m 'test(rust-utils): promote parse-name and pluralize to GREEN'
          git push origin HEAD:pro/rust-repository-port
