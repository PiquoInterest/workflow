name: Rust utilities module-scope implementation once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-utils-module-scope-implement-once.yml'

permissions:
  contents: write

jobs:
  implement:
    name: Verify and commit hardened analyzer
    if: github.repository == 'PiquoInterest/workflow' && github.ref == 'refs/heads/pro/rust-repository-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Materialize implementation and direct tests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/module-scope-implementation.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/module-scope-implementation.b64 > /tmp/module-scope-implementation.tar.gz
          tar -xzf /tmp/module-scope-implementation.tar.gz

      - name: Verify production implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/workflow-utils/Cargo.toml
          cargo fmt --manifest-path crates/workflow-utils/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets -- -D warnings

      - name: Commit verified files sequentially
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add crates/workflow-utils/src/module_scope_state.rs
          git commit -m 'feat(rust-utils): add hardened module-scope analyzer'

          git add crates/workflow-utils/src/lib.rs
          git commit -m 'feat(rust-utils): export module-scope analyzer'

          git add crates/workflow-utils/tests/module_scope_state.rs
          git commit -m 'test(rust-utils): port module-scope compatibility suite'

          git add crates/workflow-utils/tests/module_scope_state_security.rs
          git commit -m 'test(rust-utils): enforce module-scope bypass hardening'

          git push origin HEAD:pro/rust-repository-port
