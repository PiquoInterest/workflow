[package]
name              = "workflow-world"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description       = "Rust implementation of the Workflow World protocol contracts"

# Existing TypeScript suites are translated before new production behavior is
