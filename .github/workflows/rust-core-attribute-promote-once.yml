name: Rust core attribute promote once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-core-attribute-promote-once.yml'

concurrency:
  group: rust-core-attribute-promote-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript oracle dependency graph
        run: pnpm --filter '@workflow/core...' build

      - name: Reprove TypeScript and production Rust attribute parity
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/workflow-core/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/workflow-core/Cargo.toml --test attribute_changes
          cargo test --locked --manifest-path crates/workflow-core/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path crates/workflow-core/Cargo.toml --all-targets -- -D warnings
          pnpm exec vitest run packages/core/src/attribute-changes.test.ts
          cargo build --locked --manifest-path crates/workflow-core/Cargo.toml --example attribute_changes_conformance
          WORKFLOW_RUST_ATTRIBUTE_CHANGES_CONFORMANCE_BIN=crates/workflow-core/target/debug/examples/attribute_changes_conformance \
            pnpm exec vitest run rust/conformance/attribute-changes-parity.test.ts

      - name: Promote proven source and record WF-RUST-029
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin pro/rust-repository-port
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          source = "packages/core/src/attribute-changes.test.ts"

          red_path = Path("rust/tdd-red.d/core-batch-04.json")
          red = json.loads(red_path.read_text())
          original_cases = red["cases"]
          red["cases"] = [case for case in original_cases if case["typescript"] != source]
          if len(original_cases) - len(red["cases"]) != 1:
              raise SystemExit("expected exactly one attribute RED case")
          if not any(
              case["typescript"] == "packages/core/src/abort-replay-ordering.test.ts"
              for case in red["cases"]
          ):
              raise SystemExit("unrelated abort RED case was lost")
          red_path.write_text(json.dumps(red, indent=2) + "\n")

          override_path = Path("rust/test-port-overrides.d/core-batch-04.json")
          override = json.loads(override_path.read_text())
          matches = [entry for entry in override["entries"] if entry["typescript"] == source]
          if len(matches) != 1:
              raise SystemExit("expected exactly one attribute override")
          entry = matches[0]
          if entry["status"] != "red":
              raise SystemExit(f"attribute override was not RED: {entry['status']}")
          entry["status"] = "green"
          entry["rustTests"] = [
              "crates/workflow-core/tests/attribute_changes.rs",
              "rust/conformance/attribute-changes-parity.test.ts",
          ]
          entry["notes"] = (
              "The 11 declared TypeScript tests execute as 14 cases and remain green. "
              "Production Rust has 14 direct cases plus a 16-fixture differential suite "
              "covering ordered conversion, undefined-to-null deletion, malformed runtime "
              "values, exact batch/key/value caps, reserved namespaces, UTF-8 value bytes, "
              "and JavaScript UTF-16 key length including astral boundaries. Core delegates "
              "to the production Rust World validator and wraps failures as FatalError. "
              "WF-RUST-029 records the security fix that prevents scalar-count implementations "
              "from admitting keys rejected by the TypeScript boundary. GitHub Actions run "
              "33524700140 passed Rustfmt, direct Rust tests, all targets, Clippy, TypeScript "
              "oracles, and differential parity."
          )
          override_path.write_text(json.dumps(override, indent=2) + "\n")

          lib_path = Path("rust/tdd/workflow-core/src/lib.rs")
          lib_text = lib_path.read_text()
          module_line = "pub mod attribute_changes;\n"
