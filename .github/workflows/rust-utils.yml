name: Rust utilities parity

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - 'crates/workflow-utils/**'
      - 'rust/tdd/workflow-utils/**'
      - 'packages/utils/src/check-data-dir.ts'
      - 'packages/utils/src/check-data-dir.test.ts'
      - 'packages/utils/src/check-data-dir-security.test.ts'
      - 'rust/tdd-red.json'
      - 'rust/test-port-manifest.json'
      - 'rust/test-port-overrides.json'
      - 'rust/test-port-overrides.d/utils-check-data-dir-security.json'
      - 'docs/rust-port/**'
      - 'security.txt'
      - '.github/workflows/rust-utils.yml'
  pull_request:
    paths:
      - 'crates/workflow-utils/**'
      - 'rust/tdd/workflow-utils/**'
      - 'packages/utils/src/check-data-dir.ts'
      - 'packages/utils/src/check-data-dir.test.ts'
      - 'packages/utils/src/check-data-dir-security.test.ts'
      - 'rust/tdd-red.json'
      - 'rust/test-port-manifest.json'
      - 'rust/test-port-overrides.json'
      - 'rust/test-port-overrides.d/utils-check-data-dir-security.json'
      - 'docs/rust-port/**'
      - 'security.txt'
      - '.github/workflows/rust-utils.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  data-dir-contract:
    name: Workflow data directory parity and security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path crates/workflow-utils/Cargo.toml -- --check
          cargo fmt --manifest-path rust/tdd/workflow-utils/Cargo.toml -- --check

      - name: Run production Rust utility tests
        run: cargo test --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets

      - name: Run the complete translated TypeScript data-dir suite in Rust
        run: cargo test --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test check_data_dir

      - name: Lint production Rust utilities
        run: cargo clippy --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets -- -D warnings

      - name: Lint the translated Rust data-dir suite
        run: cargo clippy --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --test check_data_dir -- -D warnings

      - name: Run TypeScript utility oracles
        run: |
          pnpm exec vitest run \
            packages/utils/src/check-data-dir.test.ts \
            packages/utils/src/check-data-dir-security.test.ts
