name: Rust test manifest bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/rust-test-manifest.yml'
      - 'scripts/rust-port-test-inventory.mjs'
      - 'scripts/bootstrap-rust-test-port-manifest.mjs'
      - 'scripts/apply-rust-test-port-overrides.mjs'
      - 'rust/test-port-manifest.json'
      - 'rust/test-port-overrides.json'
      - 'rust/tdd/**'
      - 'crates/workflow-world/**'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.test.mts'
      - '**/*.test.cts'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/*.spec.mts'
      - '**/*.spec.cts'

concurrency:
  group: rust-test-manifest-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh checked-in test manifest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pro/rust-repository-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Install Rust 1.87 formatter
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: rustfmt

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Canonically format translated Rust tests
        run: |
          cargo fmt --manifest-path rust/tdd/workflow-utils/Cargo.toml
          cargo fmt --package workflow-world

      - name: Generate, apply reviewed statuses, and validate manifest
        run: |
          node scripts/rust-port-test-inventory.mjs \
            --write-json /tmp/rust-port-test-inventory.json
          node scripts/bootstrap-rust-test-port-manifest.mjs \
            /tmp/rust-port-test-inventory.json \
            rust/test-port-manifest.json
          node scripts/apply-rust-test-port-overrides.mjs \
            rust/test-port-manifest.json \
            rust/test-port-overrides.json
          node scripts/rust-port-test-inventory.mjs \
            --check rust/test-port-manifest.json

      - name: Commit only canonical generated changes
        run: |
          if [[ -z "$(git status --porcelain -- rust/tdd/workflow-utils crates/workflow-world rust/test-port-manifest.json)" ]]; then
            echo 'Translated tests and manifest are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/tdd/workflow-utils crates/workflow-world rust/test-port-manifest.json
          git commit --signoff -m 'test(rust-port): format tests and refresh manifest'
          git push origin HEAD:pro/rust-repository-port
