name: Rust TDD expected RED

on:
  pull_request:
    paths:
      - 'rust/tdd/**'
      - 'rust/tdd-red.json'
      - 'rust/test-port-overrides.json'
      - 'scripts/run-rust-tdd-red.mjs'
      - 'scripts/apply-rust-test-port-overrides.mjs'
      - '.github/workflows/rust-tdd-red.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  expected-red:
    name: Confirm translated tests fail for the recorded reason
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Check translated-test formatting
        run: |
          cargo fmt --manifest-path rust/tdd/workflow-utils/Cargo.toml -- --check
          cargo fmt --manifest-path rust/tdd/workflow-world/Cargo.toml -- --check

      - name: Compile and lint translated tests
        run: |
          cargo check --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path rust/tdd/workflow-utils/Cargo.toml --all-targets -- -D warnings
          cargo check --locked --manifest-path rust/tdd/workflow-world/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path rust/tdd/workflow-world/Cargo.toml --all-targets -- -D warnings

      - name: Prove every expected-RED port
        run: node scripts/run-rust-tdd-red.mjs rust/tdd-red.json rust/test-port-overrides.json
