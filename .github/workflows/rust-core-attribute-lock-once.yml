name: Rust core attribute lock once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-core-attribute-lock-once.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: 1.87.0

      - name: Add the production World path dependency in the temporary checkout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/workflow-core/Cargo.toml')
          text = path.read_text()
          needle = 'semver = "=1.0.26"\n'
          replacement = needle + 'workflow-world = { path = "../workflow-world" }\n'
          if needle not in text:
              raise SystemExit('semver dependency anchor was not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Generate the exact locked dependency graph
        run: cargo generate-lockfile --manifest-path crates/workflow-core/Cargo.toml

      - name: Emit the generated lockfile
        run: |
          echo 'LOCKFILE_BEGIN'
          cat crates/workflow-core/Cargo.lock
          echo 'LOCKFILE_END'
