name: Rust port source snapshot

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - .github/workflows/rust-port-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    name: Export migration branch source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: pro/rust-repository-port
          fetch-depth: 1

      - name: Create deterministic source archive
        run: |
          git archive \
            --format=tar.gz \
            --prefix=workflow-rust-port/ \
            --output=/tmp/workflow-rust-port-source.tar.gz \
            HEAD
          sha256sum /tmp/workflow-rust-port-source.tar.gz

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-rust-port-source-${{ github.sha }}
          path: /tmp/workflow-rust-port-source.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
