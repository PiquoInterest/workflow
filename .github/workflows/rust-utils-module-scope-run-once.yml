name: Rust utilities module-scope runner once

on:
  push:
    branches:
      - pro/rust-repository-port
    paths:
      - '.github/workflows/rust-utils-module-scope-run-once.yml'

permissions:
  contents: write

jobs:
  implement:
    name: Verify and commit hardened analyzer
    if: github.repository == 'PiquoInterest/workflow' && github.ref == 'refs/heads/pro/rust-repository-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: pro/rust-repository-port
          fetch-depth: 0

      - name: Install Rust 1.87
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.87.0
          components: clippy,rustfmt

      - name: Materialize implementation and direct tests
        shell: bash
        run: |
          set -euo pipefail
          cat .github/port-payloads/module-scope/00.b64 \
              .github/port-payloads/module-scope/01.b64 \
              .github/port-payloads/module-scope/02.b64 \
              .github/port-payloads/module-scope/03.b64 \
            | tr -d '\r\n' > /tmp/module-scope-implementation.b64

          test "$(wc -c < /tmp/module-scope-implementation.b64)" -eq 14748
          printf '%s  %s\n' \
            '9f0661df8ebf4fd5d0ed28f6d8bed41fd1599c5ee8d3af1eaaa96ecc8f9a179b' \
            '/tmp/module-scope-implementation.b64' \
            | sha256sum --check -

          base64 --decode /tmp/module-scope-implementation.b64 \
            > /tmp/module-scope-implementation.tar.gz
          printf '%s  %s\n' \
            'f7d011209b25974cd84ec4ff4e40aeece72bc3b836ba437a202c8f1f02aa0889' \
            '/tmp/module-scope-implementation.tar.gz' \
            | sha256sum --check -
          tar -xzf /tmp/module-scope-implementation.tar.gz

      - name: Apply parser-boundary fixes found by the first GREEN attempt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/workflow-utils/src/module_scope_state.rs')
          source = path.read_text()

          declaration_start = source.index('fn find_declaration_equals')
          declaration_end = source.index('fn update_depths', declaration_start)
          declaration_replacement = r'''fn find_declaration_equals(tokens: &[Token], start: usize, end: usize) -> Option<usize> {
              let mut depths = (0_i32, 0_i32, 0_i32);
              let mut type_argument_depth = 0_usize;
              for (index, token) in tokens.iter().enumerate().take(end).skip(start) {
                  if token.operator() == Some("=")
                      && depths == (0, 0, 0)
                      && type_argument_depth == 0
                  {
                      return Some(index);
                  }
                  if token.is_punctuation(',')
                      && depths == (0, 0, 0)
                      && type_argument_depth == 0
                  {
                      return None;
                  }
                  update_type_argument_depth(token, &mut type_argument_depth, true);
                  update_depths(token, &mut depths);
              }
              None
          }

          fn find_initializer_end(tokens: &[Token], start: usize, end: usize) -> usize {
              let mut depths = (0_i32, 0_i32, 0_i32);
              let mut type_argument_depth = 0_usize;
              for (index, token) in tokens.iter().enumerate().take(end).skip(start) {
                  if token.is_punctuation(',')
                      && depths == (0, 0, 0)
                      && type_argument_depth == 0
                  {
                      return index;
                  }
                  let opens_type_arguments =
                      type_argument_depth > 0 || starts_type_argument_list(tokens, index, end);
                  update_type_argument_depth(token, &mut type_argument_depth, opens_type_arguments);
                  update_depths(token, &mut depths);
              }
              end
          }

          fn starts_type_argument_list(tokens: &[Token], index: usize, end: usize) -> bool {
              if tokens.get(index).and_then(Token::operator) != Some("<") {
                  return false;
              }
              if !tokens.get(index.wrapping_sub(1)).is_some_and(|token| {
                  token.identifier().is_some()
                      || token.is_punctuation(')')
                      || token.is_punctuation(']')
              }) {
                  return false;
              }

              let mut depth = 0_usize;
              for cursor in index..end {
                  match tokens[cursor].operator() {
                      Some("<") => depth += 1,
                      Some(">") => depth = depth.saturating_sub(1),
                      Some(">>") => depth = depth.saturating_sub(2),
                      Some(">>>") => depth = depth.saturating_sub(3),
                      _ => {}
                  }
                  if depth != 0 {
                      continue;
                  }
                  return tokens.get(cursor + 1).is_some_and(|token| {
                      token.is_punctuation('(')
                          || token.is_punctuation('[')
                          || token.is_punctuation('.')
                          || token.is_punctuation(',')
                          || token.is_punctuation(';')
                          || matches!(
                              token.operator(),
                              Some("=" | "=>" | "?." | "?" | "|" | "&")
                          )
                  });
              }
              false
          }

          fn update_type_argument_depth(token: &Token, depth: &mut usize, allow_open: bool) {
              match token.operator() {
                  Some("<") if allow_open => *depth += 1,
                  Some(">") if *depth > 0 => *depth = depth.saturating_sub(1),
                  Some(">>") if *depth > 0 => *depth = depth.saturating_sub(2),
                  Some(">>>") if *depth > 0 => *depth = depth.saturating_sub(3),
                  _ => {}
              }
          }

          '''
          source = (
              source[:declaration_start]
              + declaration_replacement
              + source[declaration_end:]
          )

          expression_start = source.index('fn expression_end')
          expression_end = source.index('fn class_member_start', expression_start)
          expression_replacement = r'''fn expression_end(tokens: &[Token], start: usize) -> usize {
              let mut depths = (0_i32, 0_i32, 0_i32);
              for (index, token) in tokens.iter().enumerate().skip(start) {
                  if depths == (0, 0, 0)
                      && (token.is_punctuation(',')
                          || token.is_punctuation(';')
                          || token.is_punctuation(')')
                          || token.is_punctuation(']')
                          || token.is_punctuation('}'))
                  {
                      return index;
                  }
                  update_depths(token, &mut depths);
              }
              tokens.len()
          }

          '''
          source = source[:expression_start] + expression_replacement + source[expression_end:]
          path.write_text(source)
          PY

      - name: Verify production implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/workflow-utils/Cargo.toml
          cargo fmt --manifest-path crates/workflow-utils/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path crates/workflow-utils/Cargo.toml --all-targets -- -D warnings

      - name: Commit verified files sequentially
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add crates/workflow-utils/src/module_scope_state.rs
          git commit -m 'feat(rust-utils): add hardened module-scope analyzer'

          git add crates/workflow-utils/src/lib.rs
          git commit -m 'feat(rust-utils): export module-scope analyzer'

          git add crates/workflow-utils/tests/module_scope_state.rs
          git commit -m 'test(rust-utils): port module-scope compatibility suite'

          git add crates/workflow-utils/tests/module_scope_state_security.rs
          git commit -m 'test(rust-utils): enforce module-scope bypass hardening'

          git pull --rebase origin pro/rust-repository-port
          git push origin HEAD:pro/rust-repository-port
